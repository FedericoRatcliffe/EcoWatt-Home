# Broker MQTT de la casa. Sin autenticacion: escucha solo en la red local.
# Si en algun momento se expone fuera de la LAN, hay que poner password_file y allow_anonymous false.

listener 1883
allow_anonymous true

# Persistencia de sesiones y mensajes retenidos.
persistence true
persistence_location /mosquitto/data/

# Log a stdout para verlo con docker compose logs.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# WebSockets, por si alguna vez se quiere un cliente MQTT desde el navegador.
listener 9001
protocol websockets
allow_anonymous true
