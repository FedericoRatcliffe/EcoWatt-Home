services:
  postgres:
    image: postgres:17-alpine
    container_name: ecowatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecowatt
      POSTGRES_USER: ecowatt
      POSTGRES_PASSWORD: ecowatt
      # Postgres guarda timestamptz en UTC; el timezone de sesion no afecta los agregados
      # porque las consultas hacen AT TIME ZONE explicito.
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecowatt -d ecowatt"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: la API trae un broker embebido. Este servicio solo hace falta si se prefiere
  # un Mosquitto aparte, y en ese caso hay que poner "Mqtt:Embedded": false en la API.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ecowatt-mosquitto
    restart: unless-stopped
    profiles:
      - mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  api:
    build:
      context: .
      dockerfile: EcoWattCasa.API/Dockerfile
    container_name: ecowatt-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=ecowatt;Username=ecowatt;Password=ecowatt"
      Mqtt__Embedded: "true"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:8081"
    ports:
      - "5080:8080"
      # El broker embebido vive en el mismo contenedor: los Sonoff de la LAN entran por aca.
      - "1883:1883"

  frontend:
    build:
      context: ./ecowatt-frontend
      dockerfile: Dockerfile
    container_name: ecowatt-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  # Publisher simulado. Perfil aparte: cuando llegue el hardware real se deja de levantar.
  mock:
    build:
      context: .
      dockerfile: EcoWattCasa.MockDevices/Dockerfile
    container_name: ecowatt-mock
    restart: unless-stopped
    depends_on:
      - api
    environment:
      MQTT_HOST: "api"
    profiles:
      - mock

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
